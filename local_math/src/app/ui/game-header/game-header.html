<header class="game-header">
  <button
    type="button"
    class="game-header__leave"
    aria-label="Leave game"
    (click)="onLeave()"
  >
    <svg
      class="game-header__icon"
      viewBox="0 0 24 24"
      aria-hidden="true"
      focusable="false"
    >
      <path
        d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"
        fill="currentColor"
      />
    </svg>
  </button>

  <p class="game-header__score" aria-live="polite">{{ score() }}</p>

  <div class="game-header__lives" aria-label="Lives: {{ lives() }}">
    <svg
      class="game-header__icon game-header__icon--heart"
      viewBox="0 0 24 24"
      aria-hidden="true"
      focusable="false"
    >
      <path
        d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
        fill="currentColor"
      />
    </svg>
    <span class="game-header__lives-count">{{ lives() }}</span>
  </div>
</header>
