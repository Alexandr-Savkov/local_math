<svg
  class="rocket-fuel"
  viewBox="0 0 200 280"
  role="img"
  [attr.aria-label]="'Топливо: ' + label()"
>
  <defs>
    <linearGradient id="rf-body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8eef8" />
      <stop offset="28%" stop-color="#ffffff" />
      <stop offset="72%" stop-color="#f4f7fc" />
      <stop offset="100%" stop-color="#c8d4ea" />
    </linearGradient>
    <linearGradient id="rf-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5eb0ff" />
      <stop offset="45%" stop-color="#2a6fff" />
      <stop offset="100%" stop-color="#0d3ecf" />
    </linearGradient>
    <linearGradient id="rf-nose" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7ec4ff" />
      <stop offset="55%" stop-color="#2a6fff" />
      <stop offset="100%" stop-color="#1046d8" />
    </linearGradient>
    <linearGradient id="rf-fuel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7ef9ff" />
      <stop offset="40%" stop-color="#42e2ff" />
      <stop offset="100%" stop-color="#1a7dff" />
    </linearGradient>
    <linearGradient id="rf-flame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff6c8" />
      <stop offset="35%" stop-color="#ffc107" />
      <stop offset="100%" stop-color="#ff4d00" />
    </linearGradient>
    <linearGradient id="rf-window" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9efcff" />
      <stop offset="40%" stop-color="#1a6dff" />
      <stop offset="100%" stop-color="#062a8a" />
    </linearGradient>
    <linearGradient id="rf-metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8edf5" />
      <stop offset="50%" stop-color="#9aa8c0" />
      <stop offset="100%" stop-color="#5a6a82" />
    </linearGradient>
    <linearGradient id="rf-gauge-border" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe566" />
      <stop offset="100%" stop-color="#f0a800" />
    </linearGradient>
    <clipPath id="rf-tank-clip">
      <rect
        [attr.x]="tank.x"
        [attr.y]="tank.y"
        [attr.width]="tank.width"
        [attr.height]="tank.height"
        rx="6"
        ry="6"
      />
    </clipPath>
    <filter id="rf-soft-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Flames -->
  <g class="rocket-fuel__flame" filter="url(#rf-soft-glow)">
    <path d="M88 238 C84 252 92 266 100 276 C108 266 116 252 112 238 Z" fill="url(#rf-flame)" />
    <path d="M94 242 C92 250 96 260 100 268 C104 260 108 250 106 242 Z" fill="#fff8d6" opacity="0.9" />
  </g>

  <!-- Landing legs (4, metallic) -->
  <g stroke="#5a6a82" stroke-width="1.2">
    <path d="M72 210 L48 246" fill="none" stroke="url(#rf-metal)" stroke-width="5" stroke-linecap="round" />
    <path d="M128 210 L152 246" fill="none" stroke="url(#rf-metal)" stroke-width="5" stroke-linecap="round" />
    <path d="M84 218 L68 248" fill="none" stroke="url(#rf-metal)" stroke-width="4" stroke-linecap="round" />
    <path d="M116 218 L132 248" fill="none" stroke="url(#rf-metal)" stroke-width="4" stroke-linecap="round" />
  </g>
  <ellipse cx="48" cy="248" rx="11" ry="4.5" fill="url(#rf-metal)" />
  <ellipse cx="152" cy="248" rx="11" ry="4.5" fill="url(#rf-metal)" />
  <ellipse cx="68" cy="250" rx="9" ry="3.5" fill="url(#rf-metal)" />
  <ellipse cx="132" cy="250" rx="9" ry="3.5" fill="url(#rf-metal)" />
  <ellipse cx="48" cy="247" rx="6" ry="2" fill="#d8e0ec" opacity="0.7" />
  <ellipse cx="152" cy="247" rx="6" ry="2" fill="#d8e0ec" opacity="0.7" />

  <!-- Side fins — curved blue -->
  <path
    d="M58 128
       C46 148 34 178 30 208
       C28 220 36 228 48 226
       L66 210
       C70 188 72 158 70 138 Z"
    fill="url(#rf-blue)"
    stroke="#0b3ad4"
    stroke-width="1.5"
  />
  <path
    d="M142 128
       C154 148 166 178 170 208
       C172 220 164 228 152 226
       L134 210
       C130 188 128 158 130 138 Z"
    fill="url(#rf-blue)"
    stroke="#0b3ad4"
    stroke-width="1.5"
  />
  <path d="M54 150 C46 170 40 196 42 214 L58 204 C60 180 62 158 60 146 Z" fill="#7ec4ff" opacity="0.35" />
  <path d="M146 150 C154 170 160 196 158 214 L142 204 C140 180 138 158 140 146 Z" fill="#7ec4ff" opacity="0.35" />

  <!-- Fin accent lights (rectangles) -->
  <g filter="url(#rf-soft-glow)">
    <rect class="rocket-fuel__glow" x="44" y="168" width="8" height="5" rx="1.5" fill="#42e2ff" />
    <rect class="rocket-fuel__glow" x="42" y="186" width="8" height="5" rx="1.5" fill="#42e2ff" />
    <rect class="rocket-fuel__glow" x="148" y="168" width="8" height="5" rx="1.5" fill="#42e2ff" />
    <rect class="rocket-fuel__glow" x="150" y="186" width="8" height="5" rx="1.5" fill="#42e2ff" />
  </g>

  <!-- Main body — chunky egg -->
  <path
    d="M100 34
       C132 34 154 58 158 96
       L162 168
       C164 198 148 224 100 232
       C52 224 36 198 38 168
       L42 96
       C46 58 68 34 100 34 Z"
    fill="url(#rf-body)"
    stroke="#9eb0d0"
    stroke-width="1.5"
  />

  <!-- Body highlight -->
  <path
    d="M76 58 C70 96 68 140 70 172 C72 198 82 216 100 222"
    fill="none"
    stroke="#ffffff"
    stroke-width="7"
    stroke-linecap="round"
    opacity="0.32"
  />

  <!-- Panel seams -->
  <g fill="none" stroke="#9eb0d0" stroke-width="1" opacity="0.45">
    <path d="M54 100 Q100 108 146 100" />
    <path d="M48 140 Q100 150 152 140" />
  </g>

  <!-- Nose cone / blue cap -->
  <path
    d="M100 22
       C120 22 136 40 138 62
       L62 62
       C64 40 80 22 100 22 Z"
    fill="url(#rf-nose)"
    stroke="#0b3ad4"
    stroke-width="1.25"
  />
  <ellipse cx="100" cy="62" rx="38" ry="7" fill="#1a5cff" />
  <ellipse cx="100" cy="40" rx="18" ry="8" fill="#9ed0ff" opacity="0.35" />

  <!-- Antenna -->
  <line x1="100" y1="10" x2="100" y2="24" stroke="#c5d2ea" stroke-width="2.5" stroke-linecap="round" />
  <circle class="rocket-fuel__glow" cx="100" cy="7" r="5.5" fill="#42e2ff" filter="url(#rf-soft-glow)" />

  <!-- Panel rivets -->
  <g fill="#9eb0d0" opacity="0.6">
    <circle cx="56" cy="112" r="1.7" />
    <circle cx="56" cy="128" r="1.7" />
    <circle cx="144" cy="112" r="1.7" />
    <circle cx="144" cy="128" r="1.7" />
    <circle cx="62" cy="152" r="1.5" />
    <circle cx="138" cy="152" r="1.5" />
  </g>

  <!-- Side windows -->
  <circle cx="60" cy="92" r="9" fill="url(#rf-window)" stroke="#7ef9ff" stroke-width="1.75" />
  <circle cx="140" cy="92" r="9" fill="url(#rf-window)" stroke="#7ef9ff" stroke-width="1.75" />
  <circle cx="57" cy="89" r="2.8" fill="#ffffff" opacity="0.55" />
  <circle cx="137" cy="89" r="2.8" fill="#ffffff" opacity="0.55" />

  <!-- Main window -->
  <circle cx="100" cy="98" r="20" fill="url(#rf-window)" stroke="#7ef9ff" stroke-width="2.5" />
  <circle cx="100" cy="98" r="16" fill="none" stroke="#0a3db8" stroke-width="1.5" opacity="0.35" />
  <circle cx="92" cy="90" r="6" fill="#ffffff" opacity="0.4" />

  <!-- Fuel gauge frame (gold border like start art) -->
  <rect
    [attr.x]="tank.x - 6"
    [attr.y]="tank.y - 30"
    [attr.width]="tank.width + 12"
    height="108"
    rx="8"
    ry="8"
    fill="#0a1630"
    stroke="url(#rf-gauge-border)"
    stroke-width="2.5"
  />
  <rect
    [attr.x]="tank.x - 4"
    [attr.y]="tank.y - 28"
    [attr.width]="tank.width + 8"
    height="104"
    rx="6"
    ry="6"
    fill="none"
    stroke="#ffe566"
    stroke-width="1"
    opacity="0.35"
  />

  <!-- Empty tank -->
  <rect
    [attr.x]="tank.x"
    [attr.y]="tank.y"
    [attr.width]="tank.width"
    [attr.height]="tank.height"
    rx="6"
    ry="6"
    fill="#071022"
  />

  <!-- Segment guides (empty bar look) -->
  <g stroke="#1a3a6a" stroke-width="1.2" opacity="0.85">
    @for (tick of tankTicks; track tick) {
      <line
        [attr.x1]="tank.x + 3"
        [attr.y1]="tank.y + tick"
        [attr.x2]="tank.x + tank.width - 3"
        [attr.y2]="tank.y + tick"
      />
    }
  </g>

  <!-- Fuel liquid -->
  <g [attr.clip-path]="'url(#rf-tank-clip)'">
    <rect
      class="rocket-fuel__liquid"
      [attr.x]="tank.x"
      [attr.y]="fuelY()"
      [attr.width]="tank.width"
      [attr.height]="fuelHeight()"
      fill="url(#rf-fuel)"
    />
    @if (clamped() > 0) {
      <ellipse
        class="rocket-fuel__liquid"
        [attr.cx]="tank.x + tank.width / 2"
        [attr.cy]="fuelY()"
        [attr.rx]="tank.width / 2 - 1"
        ry="3.5"
        fill="#9efcff"
        opacity="0.9"
      />
    }
  </g>

  <!-- Tank glass edge -->
  <rect
    [attr.x]="tank.x"
    [attr.y]="tank.y"
    [attr.width]="tank.width"
    [attr.height]="tank.height"
    rx="6"
    ry="6"
    fill="none"
    stroke="#42e2ff"
    stroke-width="1.25"
    opacity="0.45"
  />

  <!-- FUEL label + percent -->
  <text
    [attr.x]="tank.x + tank.width / 2"
    [attr.y]="tank.y - 14"
    text-anchor="middle"
    fill="#42e2ff"
    font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
    font-size="8"
    font-weight="700"
    letter-spacing="0.12em"
  >
    FUEL
  </text>
  <text
    [attr.x]="tank.x + tank.width / 2"
    [attr.y]="tank.y - 2"
    text-anchor="middle"
    fill="#7ef9ff"
    font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
    font-size="12"
    font-weight="700"
  >
    {{ label() }}
  </text>

  <!-- Engine nozzle -->
  <ellipse cx="100" cy="230" rx="18" ry="7" fill="#4a5568" stroke="#2d3748" stroke-width="1" />
  <ellipse cx="100" cy="232" rx="12" ry="4.5" fill="#1a202c" />
  <ellipse cx="100" cy="228" rx="10" ry="2.5" fill="#718096" opacity="0.5" />
</svg>
