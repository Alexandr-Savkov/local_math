<svg
  class="rocket-fuel"
  viewBox="0 0 200 280"
  role="img"
  [attr.aria-label]="'Топливо: ' + label()"
>
  <defs>
    <linearGradient id="rf-body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dfe8f8" />
      <stop offset="35%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#c5d2ea" />
    </linearGradient>
    <linearGradient id="rf-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4da3ff" />
      <stop offset="55%" stop-color="#1a5cff" />
      <stop offset="100%" stop-color="#0b3ad4" />
    </linearGradient>
    <linearGradient id="rf-nose" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6bb6ff" />
      <stop offset="100%" stop-color="#1a5cff" />
    </linearGradient>
    <linearGradient id="rf-fuel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe566" />
      <stop offset="45%" stop-color="#ffbf00" />
      <stop offset="100%" stop-color="#ff8a00" />
    </linearGradient>
    <linearGradient id="rf-flame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff6c8" />
      <stop offset="35%" stop-color="#ffc107" />
      <stop offset="100%" stop-color="#ff4d00" />
    </linearGradient>
    <linearGradient id="rf-window" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7ef9ff" />
      <stop offset="50%" stop-color="#1a7dff" />
      <stop offset="100%" stop-color="#0a3db8" />
    </linearGradient>
    <clipPath id="rf-tank-clip">
      <rect
        [attr.x]="tank.x"
        [attr.y]="tank.y"
        [attr.width]="tank.width"
        [attr.height]="tank.height"
        rx="8"
        ry="8"
      />
    </clipPath>
    <filter id="rf-soft-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Flames -->
  <g class="rocket-fuel__flame" filter="url(#rf-soft-glow)">
    <path d="M88 232 C84 248 92 262 100 274 C108 262 116 248 112 232 Z" fill="url(#rf-flame)" />
    <path d="M94 236 C92 246 96 256 100 264 C104 256 108 246 106 236 Z" fill="#fff8d6" opacity="0.9" />
  </g>
  <g class="rocket-fuel__flame rocket-fuel__flame--side" filter="url(#rf-soft-glow)">
    <path d="M58 228 C54 240 60 250 66 256 C72 250 76 240 72 228 Z" fill="url(#rf-flame)" opacity="0.9" />
    <path d="M128 228 C124 240 128 250 134 256 C140 250 146 240 142 228 Z" fill="url(#rf-flame)" opacity="0.9" />
  </g>

  <!-- Landing pads / fin feet -->
  <ellipse cx="52" cy="230" rx="14" ry="5" fill="#1a5cff" opacity="0.85" />
  <ellipse cx="148" cy="230" rx="14" ry="5" fill="#1a5cff" opacity="0.85" />

  <!-- Side fins -->
  <path
    d="M52 150 L28 210 L42 228 L68 200 L72 168 Z"
    fill="url(#rf-blue)"
    stroke="#0b3ad4"
    stroke-width="1.5"
  />
  <path
    d="M148 150 L172 210 L158 228 L132 200 L128 168 Z"
    fill="url(#rf-blue)"
    stroke="#0b3ad4"
    stroke-width="1.5"
  />
  <path d="M42 168 L34 208 L48 218 L62 188 Z" fill="#4da3ff" opacity="0.45" />
  <path d="M158 168 L166 208 L152 218 L138 188 Z" fill="#4da3ff" opacity="0.45" />

  <!-- Main body -->
  <path
    d="M100 28
       C128 28 148 52 152 88
       L158 168
       C160 196 148 220 100 228
       C52 220 40 196 42 168
       L48 88
       C52 52 72 28 100 28 Z"
    fill="url(#rf-body)"
    stroke="#9eb0d0"
    stroke-width="1.5"
  />

  <!-- Body highlight -->
  <path
    d="M78 56 C72 90 70 130 72 168 C74 190 82 208 100 216"
    fill="none"
    stroke="#ffffff"
    stroke-width="6"
    stroke-linecap="round"
    opacity="0.35"
  />

  <!-- Nose cone -->
  <path
    d="M100 18 C118 18 132 36 134 58 L66 58 C68 36 82 18 100 18 Z"
    fill="url(#rf-nose)"
    stroke="#0b3ad4"
    stroke-width="1.25"
  />
  <ellipse cx="100" cy="58" rx="34" ry="7" fill="#1a5cff" />

  <!-- Antenna -->
  <line x1="100" y1="8" x2="100" y2="20" stroke="#c5d2ea" stroke-width="2.5" stroke-linecap="round" />
  <circle class="rocket-fuel__glow" cx="100" cy="6" r="5" fill="#42e2ff" filter="url(#rf-soft-glow)" />

  <!-- Panel rivets -->
  <g fill="#9eb0d0" opacity="0.55">
    <circle cx="62" cy="110" r="1.6" />
    <circle cx="62" cy="130" r="1.6" />
    <circle cx="138" cy="110" r="1.6" />
    <circle cx="138" cy="130" r="1.6" />
  </g>

  <!-- Side windows -->
  <circle cx="64" cy="96" r="8" fill="url(#rf-window)" stroke="#7ef9ff" stroke-width="1.5" />
  <circle cx="136" cy="96" r="8" fill="url(#rf-window)" stroke="#7ef9ff" stroke-width="1.5" />
  <circle cx="61" cy="93" r="2.5" fill="#ffffff" opacity="0.55" />
  <circle cx="133" cy="93" r="2.5" fill="#ffffff" opacity="0.55" />

  <!-- Main window -->
  <circle cx="100" cy="108" r="16" fill="url(#rf-window)" stroke="#7ef9ff" stroke-width="2" />
  <circle cx="94" cy="102" r="5" fill="#ffffff" opacity="0.45" />

  <!-- Fuel gauge frame -->
  <rect
    [attr.x]="tank.x - 4"
    [attr.y]="tank.y - 28"
    [attr.width]="tank.width + 8"
    height="104"
    rx="10"
    ry="10"
    fill="#0a1630"
    stroke="#7ef9ff"
    stroke-width="2"
    opacity="0.92"
  />

  <!-- Empty tank -->
  <rect
    [attr.x]="tank.x"
    [attr.y]="tank.y"
    [attr.width]="tank.width"
    [attr.height]="tank.height"
    rx="8"
    ry="8"
    fill="#071022"
  />

  <!-- Fuel liquid -->
  <g [attr.clip-path]="'url(#rf-tank-clip)'">
    <rect
      class="rocket-fuel__liquid"
      [attr.x]="tank.x"
      [attr.y]="fuelY()"
      [attr.width]="tank.width"
      [attr.height]="fuelHeight()"
      fill="url(#rf-fuel)"
    />
    @if (clamped() > 0) {
      <ellipse
        class="rocket-fuel__liquid"
        [attr.cx]="tank.x + tank.width / 2"
        [attr.cy]="fuelY()"
        [attr.rx]="tank.width / 2 - 1"
        ry="4"
        fill="#ffe566"
        opacity="0.85"
      />
    }
  </g>

  <!-- Tank glass highlight -->
  <rect
    [attr.x]="tank.x"
    [attr.y]="tank.y"
    [attr.width]="tank.width"
    [attr.height]="tank.height"
    rx="8"
    ry="8"
    fill="none"
    stroke="#7ef9ff"
    stroke-width="1.5"
    opacity="0.55"
  />
  <path
    [attr.d]="'M' + (tank.x + 6) + ' ' + (tank.y + 8) + ' V' + (tank.y + tank.height - 8)"
    stroke="#ffffff"
    stroke-width="2"
    stroke-linecap="round"
    opacity="0.2"
  />

  <!-- Tick marks -->
  <g stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" opacity="0.7">
    <line [attr.x1]="tank.x + 4" [attr.y1]="tank.y + 8" [attr.x2]="tank.x + 12" [attr.y2]="tank.y + 8" />
    <line [attr.x1]="tank.x + 4" [attr.y1]="tank.y + 22" [attr.x2]="tank.x + 10" [attr.y2]="tank.y + 22" />
    <line [attr.x1]="tank.x + 4" [attr.y1]="tank.y + 36" [attr.x2]="tank.x + 12" [attr.y2]="tank.y + 36" />
    <line [attr.x1]="tank.x + 4" [attr.y1]="tank.y + 50" [attr.x2]="tank.x + 10" [attr.y2]="tank.y + 50" />
    <line [attr.x1]="tank.x + 4" [attr.y1]="tank.y + 64" [attr.x2]="tank.x + 12" [attr.y2]="tank.y + 64" />
  </g>

  <!-- FUEL label + percent (above liquid, always readable) -->
  <text
    [attr.x]="tank.x + tank.width / 2"
    [attr.y]="tank.y - 14"
    text-anchor="middle"
    fill="#ffffff"
    font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
    font-size="7"
    font-weight="700"
    letter-spacing="0.06em"
  >
    ТОПЛИВО
  </text>
  <text
    [attr.x]="tank.x + tank.width / 2"
    [attr.y]="tank.y - 3"
    text-anchor="middle"
    fill="#ffe566"
    font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
    font-size="11"
    font-weight="700"
  >
    {{ label() }}
  </text>

  <!-- Engine nozzles -->
  <rect x="88" y="224" width="24" height="10" rx="3" fill="#4a5568" stroke="#2d3748" stroke-width="1" />
  <rect x="54" y="220" width="14" height="8" rx="2" fill="#4a5568" />
  <rect x="132" y="220" width="14" height="8" rx="2" fill="#4a5568" />

  <!-- Accent lights -->
  <circle class="rocket-fuel__glow" cx="56" cy="150" r="3" fill="#42e2ff" filter="url(#rf-soft-glow)" />
  <circle class="rocket-fuel__glow" cx="144" cy="150" r="3" fill="#42e2ff" filter="url(#rf-soft-glow)" />
</svg>
