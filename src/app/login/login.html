<div class="login-page" style="background-image: url(images/logo_space_math.png)">
  <form class="login-form" (submit)="onSubmit($event)">
    <h1 class="login-form__title">Sign in</h1>

    <label class="login-form__field">
      <span>Username</span>
      <input
        type="text"
        name="username"
        autocomplete="username"
        [ngModel]="username()"
        (ngModelChange)="username.set($event)"
        required
      />
    </label>

    <label class="login-form__field">
      <span>Password</span>
      <input
        type="password"
        name="password"
        autocomplete="current-password"
        [ngModel]="password()"
        (ngModelChange)="password.set($event)"
        required
      />
    </label>

    @if (error()) {
      <p class="login-form__error" role="alert">{{ error() }}</p>
    }

    <button class="login-form__submit" type="submit">Log in</button>
  </form>
</div>
